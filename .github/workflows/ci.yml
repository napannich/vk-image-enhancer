name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Verify sample generator is deterministic
        run: node scripts/generate-samples.mjs

      - name: Bundle size budget (≤ 10 MB per TZ)
        run: npm run check-size
